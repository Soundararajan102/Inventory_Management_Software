name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Tauri macOS (.dmg & .app)
        run: |
          cd backend
          npx --yes @tauri-apps/cli build --target ${{ matrix.target }} --bundles dmg,app

      - name: Upload DMG & App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Electro-Hub-macOS-${{ matrix.target }}
          path: |
            backend/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            backend/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
